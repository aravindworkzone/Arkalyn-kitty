<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Arkalyn Kitty</title>

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/mini-logo.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA / Mobile.
         `theme-color` is a placeholder here — the bootstrap below overwrites it
         with the resolved theme's surface before first paint. It stays in the
         markup so a browser that blocks inline script still gets something. -->
    <meta name="theme-color" content="#f9fafb" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arkalyn" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="google" content="notranslate" />

    <!-- Theme bootstrap. Must stay INLINE and in <head>: it runs before first
         paint so a dark-mode reload never flashes light. Mirrors the resolution
         order in src/hooks/useTheme.ts — an explicit stored choice wins,
         otherwise follow the OS.

         Phase 6 turned on the two things phase 1 held back: `color-scheme` (so
         scrollbars, form controls and the caret match) and the theme-color meta
         (so mobile browser chrome matches). Both were unsafe while the screens
         were still hardcoded dark; now that they follow the tokens, the chrome
         and the page always agree. The values MUST track --surface in
         src/index.css — light #f9fafb (gray-50), dark #080c14. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#080c14' : '#f9fafb');
        } catch (e) {
          /* Storage can throw in private/embedded contexts — fall through to
             whatever the markup already renders rather than breaking boot. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
