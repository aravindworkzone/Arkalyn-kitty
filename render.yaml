# Render Blueprint — backend web service (free tier).
# In the Render dashboard: New > Blueprint, connect this repo. Render reads this
# file, creates the service, auto-generates the token secrets, and prompts for
# the `sync: false` values (MONGO_URI, FRONTEND_URL).
# Frontend is deployed separately on Vercel — see DEPLOYMENT.md.
services:
  - type: web
    name: expense-tracker-backend
    runtime: node
    plan: free
    rootDir: backend
    region: singapore          # set close to your MongoDB Atlas cluster to cut DB latency
    buildCommand: npm run build # runs `npm install --include=dev && tsc`
    startCommand: npm start     # runs `node dist/main.js`
    healthCheckPath: /health
    autoDeploy: true            # redeploy on every push to the default branch
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false             # paste your Atlas connection string in the dashboard
      - key: FRONTEND_URL
        sync: false             # set to the Vercel URL after the frontend is deployed
      - key: FRONTEND_DASHBOARD_URL
        sync: false             # where OAuth lands on success, e.g. https://<vercel-url>/groups
      - key: ACCESS_TOKEN_SECRET
        generateValue: true     # Render generates a strong random secret
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      # Google sign-in. All three are in config/env.ts REQUIRED_ENV_VARS, so the
      # service refuses to boot without them.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false             # must match Google Console exactly; with the Vercel
                                # /api proxy this is https://<vercel-url>/api/auth/oauth
      # Transactional email (password reset). Optional — utils/email.ts no-ops
      # without them. These replace the SMTP_USER/SMTP_PASS pair this file used
      # to list, which no code has read since the move to Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Web Push (VAPID). Optional — services/push.service.ts logs a warning and
      # disables push if unset, rather than refusing to boot. The public key must
      # match VITE_VAPID_PUBLIC_KEY in the Vercel env.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
